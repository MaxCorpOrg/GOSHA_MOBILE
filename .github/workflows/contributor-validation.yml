name: contributor-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test, assemble and lint Android client
        run: ./gradlew --no-daemon testClientDebugUnitTest assembleClientDebug lintClientDebug
      - name: Validate Pull Request diff
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
